<script>
const STYLE={"sh": "1. Голос и подача  \nПишет от первого лица, как живой человек из команды бренда: «я решил», «покажу», «мне стало интересно». Обращение на «вы», дружелюбное, тёплое, разговорное. Тон заботливый, лёгкий, без назидательности. Уместны бытовые наблюдения, мягкая самоирония и простые шутки. Медицинские темы объясняются доступно, без запугивания и категоричных обещаний.\n\n2. Структура  \nПост: приветствие или вопрос/интрига; короткое объяснение темы; 3–5 советов или фактов; доброжелательный вывод; вопрос аудитории и призыв поделиться опытом.  \nРазвёрнутая статья: заголовок с любопытным вопросом; исторический или бытовой заход; последовательный разбор простыми абзацами; практический вывод; мягкая оговорка о пределах пользы. Призыв ненавязчивый: «Делитесь», «А вы знали?», «Попробуете?».\n\n3. Оформление  \nЗаголовки обычно в обычном регистре, иногда с вопросом и эмодзи. Нумерованные советы: «☀️ 1.» или «1.». Списки ингредиентов оформлять через «—». Абзацы короткие, 1–3 предложения. Эмодзи частые, но не в каждой строке: 👋 🐼 😁 🌿 🍯 🍎 💚 👀. Не перегружать оформление. Рецепт: название, порции, список продуктов, «Как приготовить», совет. Для продуктов указывать состав и назначение. Для БАД обязательно: «БАД. Не является лекарственным средством. Не заменяет назначенное врачом лечение».\n\n4. Типы материалов  \n• Советы: вводная ситуация, 3–5 простых действий, вопрос читателю.  \n• Разбор состава: что смотреть на упаковке, роль компонентов, практический вывод.  \n• Факт или викторина: вопрос, ответ, краткое объяснение, интересная деталь.  \n• История продукта/ингредиента: бытовой заход, происхождение, современное применение.  \n• Рецепт: продукты, пошаговое приготовление, вариант подачи или хранения.  \n• Карточка продукта: название, категория, состав, нейтральное назначение, предупреждение.  \n• Польза ингредиента: 2–3 подтверждённых свойства без обещаний лечения, оговорка «информация ознакомительная».\n\n5. Лексика  \nПовторять: «А знаете, что…?», «Мне стало интересно», «Вот несколько простых советов», «небольшая порция», «всё дело в мере», «полезная привычка», «из этого и складывается самочувствие», «вот такой интересный факт», «никакой сложной науки». Избегать канцелярита, давления, сенсаций, слов «вылечит», «гарантированно», «заменяет врача», «лекарство от…».\n\n6. Безопасность  \nНе обещать лечение или профилактику серьёзных заболеваний. Не выдавать БАД, чай, сироп, косметику или бальзам за лекарство. Пользу описывать как поддержку рациона, ухода или общего самочувствия. При противопоказаниях, хронических заболеваниях, беременности и приёме лекарств рекомендовать консультацию врача. Народные рецепты подавать только как ознакомительные, без опасных дозировок и обещаний результата.", "sp": "1. Голос и подача  \nОт лица бренда, без персонажа. Тон аптечный, уверенный, рекламно-информационный, прямой. Главный акцент на проблеме, составе, применении и доступности. Часто используются короткие продающие формулировки, прописные заголовки, эмодзи-маркеры. Текст может быть более категоричным по форме, но медицинские обещания нужно смягчать и проверять.\n\n2. Структура  \nПост о продукте: эмодзи-маркер; заголовок в ВЕРХНЕМ РЕГИСТРЕ; название и назначение; ключевые свойства; состав; способ применения, показания или ограничения; призыв купить.  \nРецепт: название; проблема или цель; ингредиенты с дозировками; пошаговое приготовление; срок и условия хранения; обязательная осторожная оговорка.  \nРазвёрнутая статья: проблема читателя; решение или домашний способ; подробности состава/применения; предупреждение; CTA. Концовка: «Спрашивайте в аптеках или заказывайте на маркетплейсах».\n\n3. Оформление  \nЗаголовки часто прописными: «✅ ДЛЯ ОПЕРАТИВНОЙ ПОМОЩИ», «💡 ЧЕМ ПОЛЕЗЕН…», «💥 ОПЕРАТИВНАЯ ПОМОЩЬ…». Использовать ✅ 💡 💥 ✨ ▶️ 👉 💙. Списки состава и ингредиентов, нумерация 1️⃣ или маркеры ▪️, ✔️. Абзацы короткие или средние, допустимы пустые строки. Названия продуктов выделять кавычками или прописными. Типовые приписки: «Спрашивайте в аптеках или заказывайте на маркетплейсах». Указывать состав, способ применения, противопоказание «индивидуальная непереносимость компонентов».\n\n4. Типы материалов  \n• Карточка продукта: заголовок, проблема, назначение, свойства, состав, применение, CTA.  \n• Продающий пост: жизненная ситуация, продукт как решение, 2–4 преимущества, способ применения, заказ.  \n• Разбор состава: название компонента, его роль, общий вывод без лечебных обещаний.  \n• Народный рецепт: ингредиенты, технология, дозировка, хранение, консультация врача.  \n• Домашний рецепт ухода: доступные компоненты, шаги, частота применения, осторожность.  \n• Образовательный пост: растение или вещество, традиционное использование, мягкий вывод.  \n• Новинка: крупный заголовок, название, ключевые особенности, состав, где купить.\n\n5. Лексика  \nПовторять: «оперативная помощь», «универсальное средство», «создан для», «способствует», «оказывает тонизирующее действие», «улучшает микроциркуляцию», «снимает чувство тяжести и усталости», «натуральные масла», «активные компоненты», «удобно использовать», «результат вас приятно удивит». Избегать бездоказательных формул «лечит», «гарантированно избавляет», «за один вечер», «доктор у вас в кармане», если это создаёт обещание лечения.\n\n6. Безопасность  \nНе обещать излечение рака, гипертонии, суставных и других серьёзных заболеваний. Не выдавать мази, масла, сиропы и БАД за замену терапии. Не давать рецепты со спиртом или водкой как лечебным средством. Народные рецепты сопровождать фразой: «Перед началом применения проконсультируйтесь с врачом, особенно при хронических заболеваниях и приёме препаратов». Указывать возможную аллергию, наружное применение и необходимость прекратить использование при раздражении. Не рекомендовать детям, беременным и людям с хроническими заболеваниями без отдельной оговорки."};
const TYPES=['Автовыбор','Советы','Разбор состава','Рецепт','История и интересный факт','Польза ингредиента','Карточка продукта','Продающий пост','Вопрос-викторина'];
const SIZES={post:['Пост','700-1200 знаков'],art:['Статья','1800-2800 знаков'],long:['Большая статья','3500-5000 знаков']};
const PAGES={sp:'topicsp1',sh:'topicsh2'};
const NAMES={sp:'Спецмазь',sh:'Доктор Шустер'};
const MODE={sp:'health',sh:'mood'};
const {LS}=Kit;
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t,ms){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms||2400)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

// ---------- состояние ----------
const S={b:new URLSearchParams(location.search).get('b')||LS.get('art_brand','sp'),tab:'new',form:LS.get('art_form',{}),edit:null,undo:[],topics:{},brandInfo:{},filter:''};
if(!PAGES[S.b])S.b='sp';
let db=LS.get('art_db',null)||{v:1,articles:[]};
function saveLocal(){db.updatedAt=Date.now();LS.set('art_db',db)}
function arts(){return db.articles.filter(a=>!a.deleted)}

// ---------- синхронизация базы статей с Диском (_articles.json) ----------
function merge(a,b){const m={};[...(a.articles||[]),...(b.articles||[])].forEach(x=>{const o=m[x.id];if(!o||(x.updatedAt||0)>(o.updatedAt||0))m[x.id]=x});return {v:1,articles:Object.values(m).sort((x,y)=>(y.createdAt||0)-(x.createdAt||0))}}
let pushT=null,diskState='';
function setDisk(st){diskState=st;const e=$('#disk');e.className='disk'+(st==='ok'?' ok':'');e.textContent=st==='ok'?'✓ Диск':st==='saving'?'Сохраняю…':st==='err'?'⚠ Диск':'Подключить Диск'}
function persist(){saveLocal();if(!Kit.token()){setDisk('');return}setDisk('saving');clearTimeout(pushT);pushT=setTimeout(pushNow,1200)}
async function pushNow(){try{const r=(await Kit.readAuth('_articles.json'))||{v:1,articles:[]};db=merge(r,db);saveLocal();await Kit.write('_articles.json',{v:1,articles:db.articles});setDisk('ok')}catch(e){setDisk(e&&e.code==='notoken'?'':'err')}}
async function pull(){try{const r=await Kit.readPublic('_articles.json');if(r){db=merge(db,r);saveLocal();render()}}catch(e){}setDisk(Kit.token()?'ok':'')}

// ---------- темы и описание бренда со страниц тем ----------
async function loadTopics(b){
 const page=PAGES[b];if(S.topics[b])return S.topics[b];
 const h=await (await fetch('/'+page+'/',{cache:'no-cache'})).text();
 const g=n=>{const m=h.match(new RegExp('const '+n+'=(.*?);\\n'));return m?JSON.parse(m[1]):null};
 S.brandInfo[b]={brand:g('BRAND')||'',chars:g('CHARS')||[]};
 let data=null;try{data=JSON.parse(localStorage.getItem('topics_'+page))}catch(e){}
 if(!data||data.v!==6)data={v:6,s:g('SECTIONS')||[]};
 try{data=await Kit.syncTopics('topics_'+page,data)}catch(e){}
 S.topics[b]=data;return data}

// ---------- текст статьи: строки с маркерами "# ", "- ", "> " ----------
function bodyToHTML(t){let h='',ul=false;const end=()=>{if(ul){h+='</ul>';ul=false}};
 String(t||'').split('\n').forEach(l=>{const s=l.trim();if(!s){end();return}
  if(/^[-•] /.test(s)){if(!ul){h+='<ul>';ul=true}h+=`<li>${esc(s.slice(2))}</li>`;return}end();
  if(s.startsWith('# '))h+=`<h3>${esc(s.slice(2))}</h3>`;else if(s.startsWith('> '))h+=`<p class="tip">${esc(s.slice(2))}</p>`;else h+=`<p>${esc(s)}</p>`});end();return h||'<p><br></p>'}
function blockLines(el){const t=(el.innerText||'').replace(/ /g,' ');const tag=el.tagName;
 if(tag==='H3'||/^H\d$/.test(tag))return t.split('\n').filter(x=>x.trim()).map(x=>'# '+x.trim());
 if(tag==='UL'||tag==='OL')return [...el.querySelectorAll('li')].map(li=>'- '+li.innerText.trim()).filter(x=>x!=='- ');
 if(tag==='LI')return ['- '+t.trim()];
 if(el.classList&&el.classList.contains('tip'))return t.split('\n').filter(x=>x.trim()).map(x=>'> '+x.trim());
 return t.split('\n').map(x=>x.trim()).filter(Boolean)}
function htmlToBody(ed){const out=[];[...ed.childNodes].forEach(n=>{if(n.nodeType===3){if(n.textContent.trim())out.push(n.textContent.trim());return}if(n.nodeType!==1)return;const ls=blockLines(n);if(ls.length)out.push(ls.join('\n'))});return out.join('\n\n')}
const clean=t=>String(t||'')
 .replace(/\s*\(\s*\[[^\]]*\]\([^)]*\)\s*\)/g,'')
 .replace(/\[([^\]]*)\]\((https?:)?[^)]*\)/g,'')
 .replace(/\s*\(\s*(https?:\/\/|www\.)[^\s)]*\s*\)/g,'')
 .replace(/(https?:\/\/|www\.)[^\s)]+/g,'')
 .replace(/[ \t]+([.,!?;:])/g,'$1').replace(/[ \t]{2,}/g,' ')
 .replace(/—/g,'-').replace(/\*\*/g,'');
function plain(a){const L=[];if(a.title)L.push(a.title,'');String(a.body||'').split('\n').forEach(l=>{const s=l.trim();if(!s){L.push('');return}
 if(s.startsWith('# '))L.push(s.slice(2));else if(s.startsWith('- '))L.push('• '+s.slice(2));else if(s.startsWith('> '))L.push('💡 '+s.slice(2));else L.push(s)});return L.join('\n').replace(/\n{3,}/g,'\n\n').trim()}
function tgHTML(a){const h=[];if(a.title)h.push('<b>'+esc(a.title)+'</b>','');String(a.body||'').split('\n').forEach(l=>{const s=l.trim();if(!s){h.push('');return}
 if(s.startsWith('# '))h.push('<b>'+esc(s.slice(2))+'</b>');else if(s.startsWith('- '))h.push('• '+esc(s.slice(2)));else if(s.startsWith('> '))h.push('💡 <i>'+esc(s.slice(2))+'</i>');else h.push(esc(s))});return h.join('<br>').replace(/(<br>){3,}/g,'<br><br>')}
async function copyText(t,html){try{if(html&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/plain':new Blob([t],{type:'text/plain'}),'text/html':new Blob([html],{type:'text/html'})})])}else await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Скопировано')}

// ---------- запросы к Claude ----------
const FORMAT=`Ответ строго в формате:
TITLE: заголовок статьи
---
текст статьи, где строка, начинающаяся с "# ", это подзаголовок; с "- " это пункт списка; с "> " это важная приписка или совет; остальные строки это абзацы. Между абзацами пустая строка. Эмодзи пиши прямо в тексте, как у редакторов. Никакого другого markdown, без **. Никаких ссылок, адресов сайтов и источников в тексте. Не используй длинное тире (—), вместо него дефис, двоеточие или запятую.`;
function sysFor(b){return `Ты редактор соцсетей бренда «${NAMES[b]}». Пишешь статьи и посты для ВКонтакте и Telegram так, как пишут штатные редакторы бренда. Отвечай по-русски. Не представляй персонажа словами вроде «это панда» или «я панда в худи»: просто пиши от первого лица, как редакторы. Где это уместно и не навязчиво, упоминай продукцию бренда (без выдуманных названий и цен).`}
function ctxFor(b){const bi=S.brandInfo[b]||{};return `${bi.brand||''}

ПАМЯТКА СТИЛЯ РЕДАКТОРОВ (соблюдай):
${STYLE[b]}`}
function parseOut(t){t=clean(t).trim();let title='',body=t;const m=t.match(/^\s*TITLE:\s*(.+)\s*\n/i);if(m){title=m[1].trim();body=t.slice(m[0].length)}body=body.replace(/^\s*-{3,}\s*\n/,'').trim();return {title,body}}
async function gen(prompt,b,st){const t=await Kit.ask(prompt,sysFor(b),m=>{if(st)st.textContent=m});return parseOut(t)}

function sizeLine(sz){const s=SIZES[sz]||SIZES.art;return `Объём: ${s[0].toLowerCase()}, примерно ${s[1]}.`}
function charLine(){return ''}
function others(b){return arts().filter(a=>a.brand===b).slice(0,40).map(a=>a.title).join('; ')}

async function doNew(f,st){
 const p=`${ctxFor(S.b)}

ЗАДАЧА: напиши новую ${(SIZES[f.size]||SIZES.art)[0].toLowerCase()} для соцсетей бренда.
Тема: ${f.theme||'выбери сам интересную тему в духе бренда, не повторяя уже написанные'}
${f.type&&f.type!=='Автовыбор'?'Тип материала: '+f.type+'.':'Тип материала подбери под тему.'}
${sizeLine(f.size)}
${charLine(S.b,f.char)}
${f.wish?'Пожелания: '+f.wish:''}
Уже написанные статьи (не повторять): ${others(S.b)||'нет'}

${FORMAT}`;
 const r=await gen(p,S.b,st);return newArt({mode:'new',title:r.title||f.theme||'Без названия',body:r.body,params:f})}
async function doRew(f,st){
 const p=`${ctxFor(S.b)}

ЗАДАЧА: перепиши чужую статью ниже в стиле редакторов бренда «${NAMES[S.b]}». Сохрани полезные факты и смысл, но текст должен быть полностью своими словами, чтобы не было совпадений с оригиналом. Убери чужие бренды, ссылки, контакты и сомнительные медицинские обещания. Если уместно, мягко свяжи с продукцией бренда, без навязчивости.
${f.size==='same'?'Объём: примерно как в оригинале.':sizeLine(f.size)}
${charLine(S.b,f.char)}
${f.wish?'Пожелания: '+f.wish:''}

ОРИГИНАЛ:
<<<
${f.src}
>>>

${FORMAT}`;
 const r=await gen(p,S.b,st);return newArt({mode:'rew',title:r.title||'Переписанная статья',body:r.body,src:f.src,params:f})}
async function doTopic(t,f,st){
 const p=`${ctxFor(S.b)}

ЗАДАЧА: напиши расширенную статью по утверждённой теме поста. Пост с картинкой уже есть, статья его раскрывает подробнее для подписчиков.
Тема: ${t.title}
${t.desc?'Описание темы: '+t.desc:''}${t.slides&&t.slides.length?'\nКартинки карусели: '+t.slides.join('; '):''}
${f.type&&f.type!=='Автовыбор'?'Тип материала: '+f.type+'.':''}
${sizeLine(f.size)}
${f.wish?'Пожелания: '+f.wish:''}

${FORMAT}`;
 const r=await gen(p,S.b,st);return newArt({mode:'topic',title:r.title||t.title,body:r.body,topic:{page:PAGES[S.b],key:t.key,title:t.title,desc:t.desc||'',char:t.char||''},params:f})}
function newArt(o){const a=Object.assign({id:uid(),brand:S.b,createdAt:Date.now(),updatedAt:Date.now()},o);db.articles.unshift(a);persist();return a}

// ---------- отрисовка ----------
function setBrand(b){S.b=b;LS.set('art_brand',b);document.body.classList.toggle('sh',b==='sh');$('#mk').textContent=b==='sh'?'Ш':'С';
 document.querySelectorAll('.sw button').forEach(x=>x.classList.toggle('on',x.dataset.b===b));loadTopics(b).then(()=>{if(S.tab==='top'&&!S.edit)render()}).catch(()=>{});}
function setTab(t){S.tab=t;S.edit=null;history.replaceState(null,'',location.pathname+'?b='+S.b);render();scrollTo(0,0)}
function chips(name,opts,val){return `<div class="chips" data-chip="${name}">${opts.map(([k,l])=>`<button data-v="${esc(k)}" class="${k===val?'on':''}">${esc(l)}</button>`).join('')}</div>`}
function charChips(f){if(S.b!=='sh')return '';const cs=(S.brandInfo.sh||{}).chars||['панда в красной худи','коала в зелёной худи'];return `<label class="l">От чьего лица</label>${chips('char',[['авто','Автовыбор'],...cs.map(c=>[c,c])],f.char||'авто')}`}
function typeSel(f){return `<label class="l">Тип материала</label><select class="f" data-k="type">${TYPES.map(t=>`<option ${t===(f.type||'Автовыбор')?'selected':''}>${t}</option>`).join('')}</select>`}
function sizeChips(f,same){return `<label class="l">Объём</label>${chips('size',[...(same?[['same','Как в оригинале']]:[]),...Object.entries(SIZES).map(([k,v])=>[k,v[0]])],f.size||(same?'same':'art'))}`}
function F(){S.form[S.tab]=S.form[S.tab]||{};return S.form[S.tab]}

function render(){
 document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===S.tab&&!S.edit));
 const M=$('#main');
 if(S.edit){S.sel=null;M.innerHTML=editorHTML(S.edit);mountEditor();showSel();return}
 if(S.tab==='new'){const f=F();M.innerHTML=`<div class="card"><label class="l" style="margin-top:0">О чём статья</label><input class="f" data-k="theme" value="${esc(f.theme)}" placeholder="Например: как выбрать сироп к зимнему чаю (можно пусто)">
  ${typeSel(f)}${sizeChips(f)}<label class="l">Пожелания</label><textarea class="f" data-k="wish" placeholder="Продукт, акцент, что упомянуть или избегать">${esc(f.wish)}</textarea>
  <div class="acts"><button class="btn" data-go="new">✍ Написать</button></div><div class="st" id="st"></div></div>`}
 else if(S.tab==='rew'){const f=F();M.innerHTML=`<div class="card"><label class="l" style="margin-top:0">Вставьте чужую статью</label><textarea class="f big" data-k="src" placeholder="Текст статьи целиком">${esc(f.src)}</textarea>
  ${sizeChips(f,true)}<label class="l">Пожелания</label><textarea class="f" data-k="wish" placeholder="Например: привязать к нашему сиропу, убрать рецепт">${esc(f.wish)}</textarea>
  <div class="acts"><button class="btn" data-go="rew">♻ Переписать в нашем стиле</button></div><div class="st" id="st"></div></div>`}
 else if(S.tab==='top')M.innerHTML=topicsHTML();
 else M.innerHTML=baseHTML();
}
function topicsHTML(){const d=S.topics[S.b];if(!d)return '<div class="card mut">Загружаю темы…</div>';
 const f=F();const by={};arts().filter(a=>a.brand===S.b&&a.topic).forEach(a=>{(by[a.topic.title]=by[a.topic.title]||[]).push(a)});
 let h=`<div class="card"><div class="mut" style="margin-bottom:6px">Настройки для статей по темам</div>${typeSel(f)}${sizeChips(f)}<label class="l">Общие пожелания</label><input class="f" data-k="wish" value="${esc(f.wish)}" placeholder="Можно пусто">
  <div class="acts"><a class="btn ghost sm" href="/${PAGES[S.b]}/">Открыть список тем, добавить новые</a></div></div>`;
 d.s.forEach((sec,si)=>{h+=`<h2>${esc(sec.name)}</h2>`;sec.items.forEach((it,ii)=>{const key=PAGES[S.b]+'|'+si+'|'+ii;const ex=by[it.title]||[];
  h+=`<div class="ti" id="t-${si}-${ii}"><div class="tt"><b>${ii+1}. ${esc(it.title)}</b><span>${esc(it.char||'')}${it.desc?' · '+esc(it.desc):''}</span>${ex.map(a=>`<div><span class="badge ${a.postId?'gr':''}">${a.postId?'✓ на сайте':'✓ статья'}</span><a href="#" data-open="${a.id}" style="color:var(--acc2);font-size:15px">${esc(a.title)}</a></div>`).join('')}
   <div class="st" id="st-${si}-${ii}"></div></div><button class="btn sm ${ex.length?'ghost':''}" data-gentopic="${si}|${ii}">${ex.length?'Ещё вариант':'✍ Написать'}</button></div>`})});
 return h}
function baseHTML(){const q=S.filter.toLowerCase();const list=arts().filter(a=>a.brand===S.b&&(!q||(a.title+' '+a.body).toLowerCase().includes(q)));
 const ML={new:'Новая',rew:'Переписанная',topic:'По теме'};
 return `<div class="card" style="padding:10px"><input class="f" id="flt" value="${esc(S.filter)}" placeholder="Поиск по статьям ${NAMES[S.b]}"></div>
 ${list.length?list.map(a=>`<div class="ti"><div class="tt"><b>${esc(a.title)}</b><span>${new Date(a.updatedAt||a.createdAt).toLocaleDateString('ru-RU')} · ${ML[a.mode]||''} · ${String(a.body||'').length} знаков</span><div>${a.postId?`<span class="badge gr">✓ на сайте: ${esc(a.postTitle||'')}</span>`:''}</div></div><button class="btn sm ghost" data-open="${a.id}">Открыть</button></div>`).join(''):'<div class="card mut">Пока нет статей. Напишите новую, перепишите чужую или выберите тему.</div>'}`}

function editorHTML(a){return `<div class="card">
 <input class="ed-title" id="etitle" value="${esc(a.title)}" placeholder="Заголовок">
 <div class="mut">${NAMES[a.brand]}${a.topic?' · тема: '+esc(a.topic.title):''}${a.postId?' · <b style="color:#157A43">на сайте: '+esc(a.postTitle||'')+'</b>':''}</div>
 <div class="tool" id="tool"><button data-fmt="h">Подзаголовок</button><button data-fmt="p">Абзац</button><button data-fmt="li">Список</button><button data-fmt="tip">💡 Совет</button><button data-undo>↶ Вернуть</button></div>
 <div class="ed" id="ed" contenteditable="true">${bodyToHTML(a.body)}</div>
 <div class="mut" style="margin:10px 0 2px">Правка нейросетью: выделите фрагмент и выберите действие</div><div class="mut" id="selhint" style="margin:0 0 8px;color:var(--acc2);font-weight:600"></div>
 <div class="ai"><button class="btn sm ghost" data-ai="Перепиши по-другому, сохранив смысл">Переписать</button><button class="btn sm ghost" data-ai="Сделай короче, оставь главное">Короче</button><button class="btn sm ghost" data-ai="Раскрой подробнее, добавь полезные детали">Подробнее</button><button class="btn sm ghost" data-ai="Сделай проще и живее, как в разговоре">Проще</button></div>
 <div class="ai" style="margin-top:8px"><input id="aiw" placeholder="Своё пожелание к правке"><button class="btn sm" data-ai="own">Применить</button></div>
 <div class="st" id="st"></div>
 <div class="acts"><button class="btn" data-act="site">📤 На сайт к посту</button><button class="btn ghost" data-act="vk">Копировать для ВК</button><button class="btn ghost" data-act="tg">Копировать для Telegram</button></div>
 <div class="acts"><button class="btn ghost sm" data-act="back">← К списку</button><button class="btn ghost sm" data-act="dup">Копия</button><button class="btn ghost sm" data-act="del">Удалить</button></div>
 ${a.src?`<details style="margin-top:14px"><summary class="mut">Оригинал</summary><div class="mut" style="white-space:pre-wrap;margin-top:8px">${esc(a.src)}</div></details>`:''}
 </div>`}
let edT=null;
function mountEditor(){const a=S.edit,ed=$('#ed');document.documentElement.style.setProperty('--hh',$('#hd').offsetHeight+'px');
 const sv=()=>{clearTimeout(edT);edT=setTimeout(()=>{a.title=clean($('#etitle').value.trim());a.body=htmlToBody(ed);a.updatedAt=Date.now();persist()},600)};
 ed.addEventListener('input',sv);$('#etitle').addEventListener('input',sv);
 ed.addEventListener('paste',e=>{e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t)})}
function flushEditor(){if(!S.edit||!$('#ed'))return;clearTimeout(edT);const a=S.edit;a.title=clean($('#etitle').value.trim());a.body=htmlToBody($('#ed'));a.updatedAt=Date.now();persist()}
function openArt(id){const a=db.articles.find(x=>x.id===id);if(!a)return;const cb=clean(a.body),ct=clean(a.title);if(cb!==a.body||ct!==a.title){a.body=cb;a.title=ct;a.updatedAt=Date.now();persist()}if(a.brand!==S.b)setBrand(a.brand);S.edit=a;S.undo=[];render();scrollTo(0,0)}

// блоки редактора, затронутые выделением
function liveSel(){const ed=$('#ed'),sel=getSelection();if(!ed||!sel.rangeCount)return null;const r=sel.getRangeAt(0);if(!ed.contains(r.commonAncestorContainer))return null;
 const top=n=>{while(n&&n.parentNode!==ed)n=n.parentNode;return n};const s=top(r.startContainer),e=top(r.endContainer);if(!s||!e)return null;
 const kids=[...ed.childNodes];let i=kids.indexOf(s),j=kids.indexOf(e);if(i>j)[i,j]=[j,i];return {i,j,collapsed:r.collapsed,text:sel.toString()}}
document.addEventListener('selectionchange',()=>{if(!$('#ed'))return;const l=liveSel();if(!l)return;S.sel=l.collapsed?null:l;showSel()});
function showSel(){const h=$('#selhint');if(!h)return;if(S.sel){const t=S.sel.text.replace(/\s+/g,' ').trim();h.innerHTML=`Правка коснётся только выделенного: «${esc(t.length>70?t.slice(0,70)+'…':t)}» <a href="#" data-clrsel style="color:var(--acc2)">снять</a>`}else h.textContent='Ничего не выделено: правка коснётся всей статьи'}
function selBlocks(){const ed=$('#ed');const l=S.sel;if(!ed||!l)return null;const kids=[...ed.childNodes];if(l.i<0||l.j>=kids.length)return null;return {nodes:kids.slice(l.i,l.j+1),collapsed:false}}
function _oldSel(){const ed=$('#ed'),sel=getSelection();if(!sel.rangeCount)return null;const r=sel.getRangeAt(0);if(!ed.contains(r.commonAncestorContainer))return null;
 const top=n=>{while(n&&n.parentNode!==ed)n=n.parentNode;return n};let s=top(r.startContainer),e=top(r.endContainer);if(!s||!e)return null;
 const kids=[...ed.childNodes];let i=kids.indexOf(s),j=kids.indexOf(e);if(i>j)[i,j]=[j,i];return {nodes:kids.slice(i,j+1),collapsed:r.collapsed}}
function fmt(kind){const l=liveSel()||S.sel;if(l)S.sel=Object.assign({},l,{collapsed:false});const b=selBlocks();if(!b)return;const ed=$('#ed');b.nodes.forEach(n=>{if(n.nodeType!==1&&n.nodeType!==3)return;
 const lines=(n.nodeType===3?[n.textContent]:(n.tagName==='UL'?[...n.querySelectorAll('li')].map(x=>x.innerText):n.innerText.split('\n'))).map(x=>x.trim()).filter(Boolean);
 let html='';if(kind==='li')html='<ul>'+lines.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';else html=lines.map(x=>kind==='h'?`<h3>${esc(x)}</h3>`:kind==='tip'?`<p class="tip">${esc(x)}</p>`:`<p>${esc(x)}</p>`).join('');
 const t=document.createElement('template');t.innerHTML=html||'<p><br></p>';n.replaceWith(t.content)});ed.dispatchEvent(new Event('input'))}

async function aiEdit(instr){const a=S.edit;flushEditor();const ed=$('#ed');const b=selBlocks();const st=$('#st');
 const part=b&&!b.collapsed?b.nodes.map(n=>n.nodeType===1?blockLines(n).join('\n'):n.textContent.trim()).filter(Boolean).join('\n\n'):'';
 const whole=!part;
 const p=`${ctxFor(a.brand)}

СТАТЬЯ ЦЕЛИКОМ (для контекста):
TITLE: ${a.title}
---
${a.body}

ЗАДАЧА: ${instr}.
${whole?'Правь всю статью. '+FORMAT:`Правь ТОЛЬКО этот фрагмент статьи, остальное не трогай:
<<<
${part}
>>>
Верни только новый текст фрагмента в тех же маркерах ("# ", "- ", "> ", абзацы), без TITLE и без пояснений. Не используй длинное тире.`}`;
 S.undo.push({title:a.title,body:a.body});$('.card').classList.add('busy');st.textContent='Правлю…';
 try{const t=await Kit.ask(p,sysFor(a.brand),m=>st.textContent=m);
  if(whole){const r=parseOut(t);a.title=r.title||a.title;a.body=r.body}
  else{const frag=clean(t).replace(/^\s*<<<|>>>\s*$/g,'').trim();const tp=document.createElement('template');tp.innerHTML=bodyToHTML(frag);const first=b.nodes[0];first.parentNode.insertBefore(tp.content,first);b.nodes.forEach(n=>n.remove());a.body=htmlToBody(ed)}
  a.updatedAt=Date.now();persist();render();toast('Готово')}
 catch(e){S.undo.pop();$('.card').classList.remove('busy');st.textContent=e.message}}

// ---------- отправка на сайт ----------
function cachePosts(){const c=LS.get('sm_cache',null);return c&&c.posts?c:null}
async function ensurePosts(st){let c=cachePosts();if(c)return c;st.textContent='Загружаю список постов сайта…';
 const f=document.createElement('iframe');f.style.display='none';f.src='/';document.body.appendChild(f);
 for(let i=0;i<60&&!c;i++){await new Promise(r=>setTimeout(r,1000));c=cachePosts()}f.remove();if(!c)throw new Error('Не удалось загрузить посты сайта');return c}
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>3).map(w=>w.slice(0,6));
function sim(a,b){const A=new Set(norm(a)),B=norm(b);if(!A.size||!B.length)return 0;return B.filter(w=>A.has(w)).length/Math.sqrt(A.size*B.length)}
async function sendToSite(){const a=S.edit;flushEditor();const st=$('#st');
 if(!Kit.token()){Kit.connectBox(()=>{setDisk('ok');pushNow();sendToSite()});return}
 let c;try{c=await ensurePosts(st)}catch(e){st.textContent=e.message;return}st.textContent='';
 const meta=c.meta||{posts:{}};const ref=(a.topic?a.topic.title+' ':'')+a.title;
 const posts=c.posts.filter(p=>p.mode===MODE[a.brand]).map(p=>{const m=(meta.posts||{})[p.id]||{};return Object.assign({},p,{title:m.title||p.title,hasBody:!!m.body,score:sim(ref,m.title||p.title)})}).sort((x,y)=>y.score-x.score||(y.created||0)-(x.created||0));
 const w=document.createElement('div');w.className='modal';
 const row=p=>{const s=p.slides&&p.slides[0];const img=s?(s.src||s.poster||''):'';return `<div class="pi ${p.id===a.postId?'on':''}" data-pid="${p.id}">${img?`<img src="${esc(img)}" referrerpolicy="no-referrer" loading="lazy">`:''}<div><b>${esc(p.title)}</b><span class="mut">${esc(p.group||'')}${p.hasBody?' · уже есть текст':''}${p.id===a.postId?' · сюда отправлена':''}</span></div></div>`};
 w.innerHTML=`<div class="box"><div class="hrow"><h3 style="flex:1;margin:0">К какому посту добавить текст?</h3><button class="btn sm ghost" data-x>Закрыть</button></div>
  <input class="f" id="pq" placeholder="Поиск поста" style="margin:10px 0"><div id="pl">${posts.slice(0,60).map(row).join('')}</div></div>`;
 document.body.appendChild(w);
 w.querySelector('[data-x]').onclick=()=>w.remove();
 w.querySelector('#pq').oninput=e=>{const q=e.target.value.toLowerCase();w.querySelector('#pl').innerHTML=posts.filter(p=>!q||p.title.toLowerCase().includes(q)).slice(0,60).map(row).join('')};
 w.addEventListener('click',async e=>{const r=e.target.closest('[data-pid]');if(!r)return;const p=posts.find(x=>x.id===r.dataset.pid);
  if(p.hasBody&&p.id!==a.postId&&!confirm('У этого поста уже есть текст. Заменить его этой статьёй?'))return;
  w.remove();st.textContent='Отправляю на сайт…';
  try{const M=(await Kit.readAuth('_app.json'))||{posts:{},config:{}};M.posts=M.posts||{};
   const body=(a.title&&a.title.trim().toLowerCase()!==p.title.trim().toLowerCase()?'# '+a.title+'\n\n':'')+a.body;
   M.posts[p.id]=Object.assign({},M.posts[p.id]||{},{body});
   if(a.postId&&a.postId!==p.id&&M.posts[a.postId]&&M.posts[a.postId].body&&M.posts[a.postId].body.includes(a.body.slice(0,80)))delete M.posts[a.postId].body;
   await Kit.write('_app.json',M);
   const cc=LS.get('sm_cache',null);if(cc){cc.meta=M;LS.set('sm_cache',cc)}
   a.postId=p.id;a.postTitle=p.title;a.sentAt=Date.now();a.updatedAt=Date.now();persist();render();toast('Текст добавлен к посту на сайте',3000)}
  catch(err){st.textContent=err&&err.code==='notoken'?'Подключите Диск заново':'Не удалось отправить: '+(err.message||err.code||'')}})}

// ---------- события ----------
document.addEventListener('click',async e=>{
 const t=e.target;
 const b=t.closest('.sw button');if(b){flushEditor();S.edit=null;setBrand(b.dataset.b);render();return}
 const tb=t.closest('#tabs button');if(tb){flushEditor();setTab(tb.dataset.t);return}
 if(t.closest('#disk')){if(Kit.token()){pushNow();toast('Синхронизирую с Диском')}else Kit.connectBox(()=>{setDisk('ok');pull().then(pushNow)});return}
 const ch=t.closest('[data-chip] button');if(ch){const n=ch.parentNode.dataset.chip;F()[n]=ch.dataset.v;LS.set('art_form',S.form);ch.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===ch));return}
 const op=t.closest('[data-open]');if(op){e.preventDefault();flushEditor();openArt(op.dataset.open);return}
 const go=t.closest('[data-go]');if(go){const f=F();const st=$('#st');
  if(go.dataset.go==='rew'&&!(f.src||'').trim()){toast('Вставьте текст статьи');return}
  go.disabled=true;st.textContent='Пишу статью, это может занять до минуты…';
  try{const a=go.dataset.go==='new'?await doNew(f,st):await doRew(f,st);if(go.dataset.go==='rew'){f.src='';LS.set('art_form',S.form)}S.edit=a;S.undo=[];render();scrollTo(0,0);toast('Статья готова')}
  catch(err){st.textContent=err.message;go.disabled=false}return}
 const gt=t.closest('[data-gentopic]');if(gt){const [si,ii]=gt.dataset.gentopic.split('|').map(Number);const it=S.topics[S.b].s[si].items[ii];const st=$(`#st-${si}-${ii}`);
  gt.disabled=true;st.textContent='Пишу статью…';
  try{const a=await doTopic(Object.assign({key:PAGES[S.b]+'|'+si+'|'+ii},it),F(),st);S.edit=a;S.undo=[];render();scrollTo(0,0);toast('Статья готова')}
  catch(err){st.textContent=err.message;gt.disabled=false}return}
 if(t.closest('[data-clrsel]')){e.preventDefault();S.sel=null;getSelection().removeAllRanges();showSel();return}
 const fm=t.closest('[data-fmt]');if(fm){fmt(fm.dataset.fmt);return}
 if(t.closest('[data-undo]')){const u=S.undo.pop();if(!u){toast('Нечего возвращать');return}Object.assign(S.edit,u,{updatedAt:Date.now()});persist();render();return}
 const ai=t.closest('[data-ai]');if(ai){let ins=ai.dataset.ai;if(ins==='own'){ins=$('#aiw').value.trim();if(!ins){toast('Впишите пожелание');return}}aiEdit(ins);return}
 const ac=t.closest('[data-act]');if(ac){const a=S.edit;if(!a)return;flushEditor();const k=ac.dataset.act;
  if(k==='vk')copyText(plain(a));
  if(k==='tg')copyText(plain(a),tgHTML(a));
  if(k==='site')sendToSite();
  if(k==='back'){S.edit=null;S.tab=a.topic&&S.tab==='top'?'top':'base';render()}
  if(k==='dup'){const c=newArt(Object.assign({},a,{id:uid(),title:a.title+' (копия)',postId:'',postTitle:'',sentAt:0,createdAt:Date.now(),updatedAt:Date.now()}));S.edit=c;render();toast('Копия создана')}
  if(k==='del'){if(!confirm('Удалить статью из базы?'))return;a.deleted=true;a.updatedAt=Date.now();persist();S.edit=null;S.tab='base';render()}
  return}
});
document.addEventListener('mousedown',e=>{if(e.target.closest('#tool button,[data-ai]'))e.preventDefault()});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){F()[k]=e.target.value;LS.set('art_form',S.form)}if(e.target.id==='flt'){S.filter=e.target.value;const pos=e.target.selectionStart;render();const f=$('#flt');f.focus();f.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){F()[k]=e.target.value;LS.set('art_form',S.form)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='aiw'){e.preventDefault();e.target.nextElementSibling.click()}});
addEventListener('pagehide',flushEditor);

// ---------- старт ----------
setBrand(S.b);render();pull();
(async()=>{const m=location.hash.match(/topic=([^&]+)/);if(!m)return;const [page,si,ii]=decodeURIComponent(m[1]).split('|');const b=page==='topicsh2'?'sh':'sp';
 setBrand(b);S.tab='top';const d=await loadTopics(b);render();const it=d.s[+si]&&d.s[+si].items[+ii];if(!it)return;
 const ex=arts().find(a=>a.brand===b&&a.topic&&a.topic.title===it.title);history.replaceState(null,'',location.pathname+'?b='+b);
 if(ex){openArt(ex.id);return}
 const el=$(`#t-${si}-${ii}`);if(el){el.scrollIntoView({block:'center'});el.style.outline='3px solid var(--acc)'}})();
</script>
</body>
</html>
