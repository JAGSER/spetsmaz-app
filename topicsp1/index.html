"Растирки"];
function apiKey(){let k='';try{k=localStorage.getItem('xpiki_key')||''}catch(e){}
 if(!k){k=(prompt('Ключ API xpiki (нужен один раз, хранится только в этом браузере)')||'').trim();if(k)try{localStorage.setItem('xpiki_key',k)}catch(e){}}
 return k}
const STORE='topics_'+location.pathname.replace(/\W/g,'');
let data;
try{data=JSON.parse(localStorage.getItem(STORE))}catch(e){}
if(!data||data.v!==6)data={v:6,s:SECTIONS};
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e){}};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200)}

function render(){
 const L=document.getElementById('list');L.innerHTML='';
 data.s.forEach((sec,si)=>{
  const h=document.createElement('h2');h.textContent=sec.name;L.appendChild(h);
  sec.items.forEach((it,ii)=>{
   const c=document.createElement('div');c.className='card';c.dataset.si=si;c.dataset.ii=ii;
   const car=sec.carousel;
   c.innerHTML=`<div class="t"><span class="num">${ii+1}.</span><span contenteditable data-f="title">${esc(it.title)}</span></div>
    <div class="row"><b>Персонаж:</b> <span contenteditable data-f="char">${esc(it.char)}</span></div>
    ${car?`<div class="row"><b>Картинок:</b> <span contenteditable data-f="count">${esc(it.count)}</span></div>
     <ol contenteditable data-f="slides">${(it.slides||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`
     :`<div class="row"><b>Описание:</b> <span contenteditable data-f="desc">${esc(it.desc)}</span></div>`}
    <div class="acts"><button class="btn sm ghost" data-a="regen">↻ Перегенерировать</button><button class="btn sm ghost" data-a="copy">Копировать</button><span class="st"></span></div>
    <div class="wish"><input placeholder="Пожелание к новой теме (можно пусто)"><button class="btn sm" data-a="go">Создать</button></div>`;
   L.appendChild(c);
  });
 });
}
function itemText(sec,it,i){
 let t=`${i+1}. ${it.title}\nПерсонаж: ${it.char}\n`;
 if(sec.carousel){t+=`Картинок: ${it.count}\nДополнительные картинки:\n`+(it.slides||[]).map((s,k)=>`${k+1}) ${s}`).join('\n')+'\n'}
 else t+=`Описание: ${it.desc}\n`;
 return t}
function allText(){return data.s.map(sec=>sec.name+'\n\n'+sec.items.map((it,i)=>itemText(sec,it,i)).join('\n')).join('\n\n')}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Скопировано')}

document.addEventListener('input',e=>{
 const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
 const c=e.target.closest('.card');const it=data.s[c.dataset.si].items[c.dataset.ii];
 if(f==='slides')it.slides=[...e.target.querySelectorAll('li')].map(l=>l.textContent.trim()).filter(Boolean);
 else it[f]=e.target.textContent.trim();
 save()});
document.getElementById('copyAll').onclick=()=>copy(allText());
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const c=b.closest('.card');const sec=data.s[c.dataset.si];const ii=+c.dataset.ii;const it=sec.items[ii];
 if(b.dataset.a==='copy')copy(itemText(sec,it,ii));
 if(b.dataset.a==='regen'){const w=c.querySelector('.wish');w.classList.toggle('on');if(w.classList.contains('on'))w.querySelector('input').focus()}
 if(b.dataset.a==='go')regen(c,sec,ii,c.querySelector('.wish input').value.trim());
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.wish input')){e.preventDefault();e.target.nextElementSibling.click()}});

async function callApi(prompt,st){
 const key=apiKey();if(!key)throw new Error('нужен ключ API');
 for(let a=1;a<=40;a++){
  try{
   const r=await fetch('https://api.xpiki.com/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-opus-5-5',max_tokens:1500,messages:[{role:'system',content:'Отвечай по-русски. Только JSON без пояснений и без markdown. Не используй длинное тире.'},{role:'user',content:prompt}]})});
   const j=await r.json().catch(()=>({}));
   if(r.ok){const t=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';const s=t.indexOf('{'),e=t.lastIndexOf('}');return JSON.parse(t.slice(s,e+1))}
   if(r.status===401){try{localStorage.removeItem('xpiki_key')}catch(e){}throw new Error('ключ не подошёл, нажмите ещё раз')}
   if(![429,500,502,503,529].includes(r.status))throw new Error((j.error&&j.error.message)||('ошибка '+r.status));
  }catch(err){if(err instanceof SyntaxError)throw new Error('ответ не разобран');if(!/fetch|network|Failed/i.test(err.message))throw err}
  st.textContent='API занят, жду… попытка '+a;await new Promise(r=>setTimeout(r,15000));
 }
 throw new Error('API долго занят, попробуйте позже')}

async function regen(c,sec,ii,wish){
 const st=c.querySelector('.st');c.classList.add('busy');st.textContent='Генерирую…';
 const others=data.s.flatMap(s=>s.items.map(x=>x.title)).filter((t,i)=>t!==sec.items[ii].title);
 const shape=sec.carousel?'{"title":"короткое название карусели","char":"персонаж","count":"N, одна общая обложка и M дополнительных","slides":["тема доп. картинки 1","..."]} (M от 5 до 7, slides ровно M штук)'
  :'{"title":"заголовок поста","char":"персонаж","desc":"описание одной фразой"}';
 const prompt=`${BRAND}
Раздел: ${sec.name}. Придумай ОДНУ новую тему ${sec.carousel?'карусели':'поста'} вместо этой: "${sec.items[ii].title}".
${wish?'Пожелание: '+wish+'\n':''}Персонаж строго один из: ${CHARS.join(', ')}. Выбирай по логике персонажей.
Стиль заголовков как у прошлых тем. Нельзя повторять или перефразировать темы ниже.
Другие новые темы на странице: ${others.join('; ')}
Уже вышедшие темы: ${PAST.join('; ')}
Ответ строго JSON: ${shape}`;
 try{
  const r=await callApi(prompt,st);
  const it=sec.items[ii];it.title=r.title||it.title;it.char=r.char||it.char;
  if(sec.carousel){it.count=r.count||it.count;if(Array.isArray(r.slides))it.slides=r.slides}else it.desc=r.desc||it.desc;
  save();render();toast('Тема обновлена');
 }catch(e){c.classList.remove('busy');st.textContent=e.message}
}
render();
</script>
