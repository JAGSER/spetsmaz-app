<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#FBE6E3">
<meta name="referrer" content="no-referrer">
<title>Спецмазь и Доктор Шустер</title>
<link rel="apple-touch-icon" href="icon3-192.png"><link rel="icon" href="icon3-192.png"><meta name="apple-mobile-web-app-title" content="Шустер"><link rel="manifest" href="manifest.json">
<script defer src="https://cloud.umami.is/script.js" data-website-id="cb0ec999-076a-4bd0-ad61-49313a08c950"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--nav:rgba(255,255,255,.96);--card:#fff;--ink2:#3a3532;--acc:#d7141a;--acc2:#b0101a;--soft:#fff0ee;--bg:#f6f4f2;--card:#fff;--ink:#1d1b1a;--mut:#8a8580;--line:#ece7e3}
body.mood{--acc:#1E9E58;--acc2:#157A43;--soft:#E3F5EA;--bg:#f2f5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-size:calc(19px*var(--fz,1));background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;transition:background .3s}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;font-size:calc(19px*var(--fz,1));width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:80px;position:relative}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 14px 6px;transition:background .3s}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:calc(21px*var(--fz,1));letter-spacing:-.3px}
.logo .mark{width:34px;height:34px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#fff;font-size:calc(19px*var(--fz,1));overflow:hidden}
.logo .mark img{width:100%;height:100%;object-fit:cover}
.bell{position:relative;width:40px;height:40px;border-radius:11px;background:var(--card);display:grid;place-items:center;font-size:calc(20px*var(--fz,1))}
.bell b{position:absolute;top:-4px;right:-4px;background:var(--acc);color:#fff;font-size:calc(14px*var(--fz,1));min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.switch{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:16px;padding:3px;margin-top:7px;position:relative}
.switch button{padding:9px 0;border-radius:12px;font-weight:800;font-size:calc(17px*var(--fz,1));z-index:1;transition:color .25s;color:var(--mut)}
.switch .pill{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);left:4px;border-radius:12px;background:#d7141a;transition:left .3s,background .3s}
body.mood .switch .pill{left:50%;background:#1E9E58}
body:not(.mood) .switch .h,body.mood .switch .m{color:#fff}
main{padding:4px 16px}
.stories{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 12px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 auto;width:84px;text-align:center;font-size:calc(14px*var(--fz,1));font-weight:600;color:var(--mut)}
.story .ring{width:78px;height:78px;border-radius:50%;padding:3px;background:conic-gradient(var(--acc),#ffb000,var(--acc));margin:0 auto 4px}
.story.seen .ring{background:#d6d1cc}
.story .ring>*{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg);display:block;background:var(--card)}
.story span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border-radius:22px;overflow:hidden;margin-bottom:16px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.card .cb{padding:12px 16px 14px}
.card h3{margin:0 0 4px;font-size:calc(23px*var(--fz,1));letter-spacing:-.2px}
.card p{margin:0;color:#4b4642;font-size:calc(18px*var(--fz,1));line-height:1.45}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:calc(16px*var(--fz,1));font-weight:600;padding:4px 10px;border-radius:20px;background:var(--soft);color:var(--acc2)}
.mp{display:flex;gap:12px;margin-top:10px;font-size:calc(16px*var(--fz,1));color:var(--mut);align-items:center;flex-wrap:wrap}
.mp a{color:var(--mut);text-decoration:none;border-bottom:1px dotted #c5beb8}
.ic{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;font-size:calc(25px*var(--fz,1));background:var(--soft)}
.fav.on{color:var(--acc)}
.badge{font-size:calc(14px*var(--fz,1));font-weight:700;padding:3px 8px;border-radius:8px;background:var(--card)4d6;color:#8a5a00}
/* slider */
.slider{position:relative;aspect-ratio:3/4;background:#eee;overflow:hidden}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x pan-y}
.track::-webkit-scrollbar{display:none}
.slider.zoomed .track{overflow:hidden;touch-action:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:center;position:relative;overflow:hidden}
.media{position:absolute;inset:0;transform-origin:0 0;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.media video.anim{position:absolute;inset:0;background:transparent;opacity:0;transition:opacity .35s}video.anim.ok{opacity:1}
.media video,.media img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.hint{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 0 rgba(255,255,255,.8);animation:pulse 1.8s infinite;pointer-events:none;display:grid;place-items:center;font-size:calc(14px*var(--fz,1));color:var(--acc);font-weight:900}
.hint{transition:opacity .45s ease .5s}
.slider.zoomed .hint{opacity:0;transition:opacity .15s}
.feedcard .hint{display:none}
@keyframes pulse{70%{box-shadow:0 0 0 14px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.55);transition:width .2s}
.dots i.on{width:18px;background:var(--card)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);font-size:calc(23px*var(--fz,1));display:none}
@media(hover:hover){.slider:hover .arrow{display:grid;place-items:center}}
.slider.zoomed .arrow{display:none!important}
.arrow.l{left:8px}.arrow.r{right:8px}
.zlabel{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:calc(16px*var(--fz,1));font-weight:700;padding:5px 10px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none}
.slider.zoomed .zlabel{opacity:0;display:none}
.zbtn{position:absolute;top:50%;width:38px;height:38px;margin-top:-19px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:calc(24px*var(--fz,1));font-weight:700;line-height:1;display:none;place-items:center;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.25);animation:zbin .3s ease}
.zbtn.l{left:8px}.zbtn.r{right:8px}
.slider.zoomed.hasz .zbtn{display:grid}
@keyframes zbin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
/* admin */
.admbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.admzk{display:flex;flex-direction:column;gap:10px}
.admzk .thumbs{display:flex;gap:6px;overflow-x:auto}.admzk .thumbs .t{width:54px;height:72px;border-radius:8px;overflow:hidden;flex:none;opacity:.55;outline:2px solid transparent;cursor:pointer;position:relative}.admzk .thumbs .t.on{opacity:1;outline-color:var(--acc)}.admzk .thumbs img{width:100%;height:100%;object-fit:cover}
#zksave{position:sticky;bottom:8px;z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.2)}
#zksave.pulse{animation:zkp 1.4s infinite}@keyframes zkp{50%{transform:scale(1.03)}}
/* nav */
html,body{overflow-x:clip}
main{overflow-x:clip}
nav{user-select:none;-webkit-user-select:none;transform:translateZ(0);touch-action:pan-y;position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;width:100%;max-width:480px}
nav button{flex:1;padding:5px 0 6px;font-size:calc(12px*var(--fz,1));font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:calc(22px*var(--fz,1));filter:grayscale(1);opacity:.6}
nav button.on{color:var(--acc)}
nav button.on span{filter:none;opacity:1}
h2{font-size:calc(29px*var(--fz,1));margin:8px 0 12px;letter-spacing:-.3px}
h4{margin:16px 0 8px;font-size:calc(20px*var(--fz,1))}
.box{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px}
.btn{background:var(--acc);color:#fff;font-weight:800;padding:16px 22px;border-radius:14px;text-align:center;display:inline-block}
.btn.ghost{background:var(--soft);color:var(--acc2)}
.btn.sm{padding:12px 16px;font-size:calc(17px*var(--fz,1));border-radius:11px}
.btn:disabled{opacity:.45}
.wide{width:100%;display:block}
.muted{color:var(--mut);font-size:calc(17px*var(--fz,1))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:12px 18px;border-radius:20px;background:var(--card);font-size:calc(17px*var(--fz,1));font-weight:700;border:1.5px solid var(--line)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.search{position:relative}
.search input{padding-left:48px;border-radius:18px;border:0;height:60px}
.search::before{content:'🔍';position:absolute;left:13px;top:13px;font-size:calc(22px*var(--fz,1))}
mark{background:#ffe27a;border-radius:3px;padding:0 1px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet .in{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px 30px;animation:up .25s}
.sheet .close{position:sticky;top:0;display:flex;align-items:center;justify-content:center;margin:-4px 0 10px auto;width:44px;height:44px;border-radius:50%;background:var(--card);font-size:calc(22px*var(--fz,1));z-index:4;box-shadow:0 2px 8px rgba(0,0,0,.12)}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@keyframes fade{from{opacity:0}}
.rich h1,.rich h2{font-size:calc(26px*var(--fz,1));margin:18px 0 8px}
.rich p{color:var(--ink2);font-size:calc(20px*var(--fz,1));line-height:1.6;margin:0 0 10px}
.rich ul{padding-left:20px;margin:0 0 10px}.rich li{margin-bottom:6px;line-height:1.5}
.rich .tipb{background:var(--soft);border-left:4px solid var(--acc);border-radius:12px;padding:12px 14px;margin:12px 0;font-weight:600}
.prod{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.prod .mp{margin:4px 0 0}
/* story viewer */
.sv{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center}
.sv .st{position:relative;width:100%;max-width:480px;height:100%;max-height:100vh}
.sv .media{position:absolute;inset:0}
.sv .media video,.sv .media img{object-fit:contain}
.sv .bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:2}
.sv .bars i{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.sv .bars i b{display:block;height:100%;width:0;background:var(--card)}
.sv .x{position:absolute;top:22px;right:12px;color:#fff;font-size:calc(34px*var(--fz,1));z-index:3}
.sv .ttl{position:absolute;top:24px;left:14px;color:#fff;font-weight:800;z-index:2;text-shadow:0 1px 4px #0008}
.sv .go{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:3}
.sv .tapL,.sv .tapR{position:absolute;top:0;bottom:0;width:35%;z-index:1}.sv .tapL{left:0}.sv .tapR{right:0}
/* body map */


.gset{margin-bottom:14px} .gprods{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap} .gp{flex:1 1 120px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--bg);border-radius:14px;padding:10px} .gp img{height:110px;object-fit:contain} .gp span{font-weight:700;font-size:calc(15px*var(--fz,1));line-height:1.25;flex:1} .shelves .chip small{opacity:.6;font-weight:600;margin-left:2px} .bm{text-align:center}.bm .bubble{font-size:calc(17px*var(--fz,1));padding:8px 14px;margin-top:-6px}

.bm .z{cursor:pointer}
.bm .z:hover{filter:brightness(1.06)}
.bm .z.on{animation:zglow .7s ease-in-out infinite alternate}
@keyframes zglow{from{filter:drop-shadow(0 0 2px #ff2020)}to{filter:drop-shadow(0 0 9px #ff2020) brightness(1.08)}}
.bm .guy,.bm .guy g{transform-box:view-box}
.bm .eye{transform-box:fill-box;transform-origin:center;animation:eblink 4.5s infinite}
@keyframes eblink{0%,93%,100%{transform:none}96%{transform:scaleY(.12)}}
.bm .drop{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
@keyframes pose{to{transform:var(--p)}}
@keyframes wig{from{transform:var(--a)}to{transform:var(--b)}}
@keyframes cough{0%,45%,100%{transform:none}8%,26%{transform:translateY(5px) rotate(3deg)}17%,35%{transform:none}}
@keyframes stiff{0%,100%{transform:none}25%{transform:rotate(-6deg)}50%{transform:none}75%{transform:rotate(6deg)}}
@keyframes squat{0%,100%{transform:none}45%,60%{transform:translateY(11px)}}
@keyframes squatL{0%,100%{transform:none}45%,60%{transform:rotate(18deg)}}
@keyframes squatS{0%,100%{transform:none}45%,60%{transform:rotate(-36deg)}}
@keyframes squatLR{0%,100%{transform:none}45%,60%{transform:rotate(-18deg)}}
@keyframes squatSR{0%,100%{transform:none}45%,60%{transform:rotate(36deg)}}
@keyframes rub{0%,100%{transform:var(--p)}50%{transform:var(--b)}}
.bm .idle .bd{--a:scaleY(1);--b:scaleY(1.01);animation:wig 1.6s ease-in-out infinite alternate}
.bm .idle .hd{--a:rotate(-2deg);--b:rotate(2deg);animation:wig 2.4s ease-in-out infinite alternate}
/* голова */
.bm .a-head .uaL{--p:rotate(167deg)}.bm .a-head .faL{--p:rotate(61deg)}.bm .a-head .uaR{--p:rotate(-167deg)}.bm .a-head .faR{--p:rotate(-61deg)}
.bm .a-head :is(.uaL,.faL,.uaR,.faR){animation:pose .45s cubic-bezier(.3,1.3,.5,1) forwards}
.bm .a-head .hd{--a:rotate(-6deg);--b:rotate(6deg);animation:wig .35s .4s ease-in-out infinite alternate}
/* шея */
.bm .a-neck .uaR{--p:rotate(-164deg);animation:pose .45s ease-out forwards}
.bm .a-neck .faR{--p:rotate(-128deg);--b:rotate(-142deg);animation:pose .45s ease-out forwards,rub .5s .45s ease-in-out infinite}
.bm .a-neck .hd{--p:rotate(-9deg);animation:pose .5s ease-out forwards}
/* плечи */
.bm .a-shoulders :is(.uaL,.uaR,.shc){--a:translateY(0);--b:translateY(-12px);animation:wig .4s ease-in-out infinite alternate}
.bm .a-shoulders .hd{--a:translateY(0);--b:translateY(-4px);animation:wig .4s ease-in-out infinite alternate}
/* грудь */
.bm .a-chest .uaL{--p:rotate(-16deg)}.bm .a-chest .faL{--p:rotate(-133deg)}
.bm .a-chest :is(.uaL,.faL){animation:pose .45s ease-out forwards}
.bm .a-chest .bd{animation:cough 1.8s .4s ease-in-out infinite}
/* живот */
.bm .a-belly .uaL{--p:rotate(14deg)}.bm .a-belly .faL{--p:rotate(-98deg)}.bm .a-belly .uaR{--p:rotate(-14deg)}.bm .a-belly .faR{--p:rotate(98deg)}
.bm .a-belly :is(.uaL,.faL,.uaR,.faR){animation:pose .45s ease-out forwards}
.bm .a-belly :is(.hdL,.hdR){--a:rotate(-16deg);--b:rotate(16deg);animation:wig .3s .45s ease-in-out infinite alternate}
.bm .a-belly .bd{--a:scaleX(1);--b:scaleX(1.04);animation:wig .45s ease-in-out infinite alternate}
/* спина */
.bm .a-back .uaR{--p:rotate(-23deg);animation:pose .5s ease-out forwards}
.bm .a-back .faR{--p:rotate(124deg);--b:rotate(108deg);animation:pose .5s ease-out forwards,rub .35s .5s ease-in-out infinite}
.bm .a-back .bd{--a:rotate(-2deg);--b:rotate(2deg);animation:wig .7s ease-in-out infinite alternate}
/* поясница и бёдра: руки в бока */
.bm :is(.a-lower,.a-hips) .uaL{--p:rotate(25deg)}.bm :is(.a-lower,.a-hips) .faL{--p:rotate(-73deg)}.bm :is(.a-lower,.a-hips) .uaR{--p:rotate(-25deg)}.bm :is(.a-lower,.a-hips) .faR{--p:rotate(73deg)}
.bm :is(.a-lower,.a-hips) :is(.uaL,.faL,.uaR,.faR){animation:pose .45s ease-out forwards}
.bm .a-lower .bd{animation:stiff 2.6s .4s ease-in-out infinite}
/* бёдра: таз ходит влево-вправо, стопы на месте */
.bm .a-hips .low{--a:translateX(-9px);--b:translateX(9px);animation:wig .55s ease-in-out infinite alternate}
.bm .a-hips :is(.lgL,.lgR){--a:rotate(-2.5deg);--b:rotate(2.5deg);animation:wig .55s ease-in-out infinite alternate}
.bm .a-hips .bd{--a:translateX(-5px) rotate(2.5deg);--b:translateX(5px) rotate(-2.5deg);animation:wig .55s ease-in-out infinite alternate}
/* колени: марширует на месте, поднимая колени по очереди */
@keyframes kneeL{0%,50%,100%{transform:none}25%{transform:translateY(-46px)}}
@keyframes kneeR{0%,50%,100%{transform:none}75%{transform:translateY(-46px)}}
@keyframes kbob{0%,50%,100%{transform:none}25%,75%{transform:translateY(-6px)}}
.bm .a-knees .lgL{animation:kneeL 1.3s ease-in-out infinite}
.bm .a-knees .lgR{animation:kneeR 1.3s ease-in-out infinite}
.bm .a-knees .uaL{--a:rotate(-12deg);--b:rotate(12deg);animation:wig .65s ease-in-out infinite alternate}
.bm .a-knees .uaR{--a:rotate(-12deg);--b:rotate(12deg);animation:wig .65s ease-in-out infinite alternate}
/* руки и локти: трёт локоть другой рукой */
.bm .a-arms .uaL{--p:rotate(0deg)}.bm .a-arms .faL{--p:rotate(-90deg);--b:rotate(-70deg)}
.bm .a-arms .uaL{animation:pose .4s ease-out forwards}
.bm .a-arms .faL{animation:pose .4s ease-out forwards,rub 1.2s .4s ease-in-out infinite}
.bm .a-arms .uaR{--p:rotate(42deg);animation:pose .45s ease-out forwards}
.bm .a-arms .faR{--p:rotate(30deg);--b:rotate(18deg);animation:pose .45s ease-out forwards,rub .35s .45s ease-in-out infinite}
/* кисти */
.bm .a-hands .uaL{--p:rotate(8deg)}.bm .a-hands .faL{--p:rotate(-137deg)}.bm .a-hands .uaR{--p:rotate(-8deg)}.bm .a-hands .faR{--p:rotate(137deg)}
.bm .a-hands :is(.uaL,.faL,.uaR,.faR){animation:pose .45s ease-out forwards}
.bm .a-hands :is(.hdL,.hdR){--a:rotate(-14deg);--b:rotate(14deg);animation:wig .09s .45s linear infinite alternate}
/* стопы */
.bm .a-feet{--a:translateY(0);--b:translateY(-22px);animation:wig .32s ease-out infinite alternate}
.bm .a-feet .lgR{--p:translateY(-34px);animation:pose .3s ease-out forwards}
.bm .a-feet .uaL{--a:rotate(60deg);--b:rotate(85deg);animation:wig .32s ease-in-out infinite alternate}
.bm .a-feet .uaR{--a:rotate(-60deg);--b:rotate(-85deg);animation:wig .32s ease-in-out infinite alternate}
.bubble{display:inline-block;position:relative;background:var(--card);border:2.5px solid #1d1b1a;border-radius:18px;padding:10px 16px;font-weight:800;font-size:calc(19px*var(--fz,1));margin:4px 0 2px;max-width:92%}
.bubble::after{content:'';position:absolute;left:50%;bottom:-11px;margin-left:-9px;border:9px solid transparent;border-top-color:#1d1b1a;border-bottom:0}
.bmseg{display:inline-flex;background:var(--bg);border-radius:14px;padding:3px;margin:8px 0}
.bmseg button{padding:9px 16px;border-radius:11px;font-weight:700;font-size:calc(16px*var(--fz,1));color:var(--mut)}
.bmseg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.bmgrid{display:grid;grid-template-columns:48% 1fr;gap:10px;align-items:center;margin-top:6px}
.bmfig svg{width:100%;height:auto;display:block;overflow:visible}

/* game */
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);padding:8px;border-radius:20px;touch-action:none;user-select:none}
.cell{aspect-ratio:1;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:calc(34px*var(--fz,1));transition:transform .15s,opacity .2s}
.cell.sel{transform:scale(.86);box-shadow:0 0 0 3px var(--acc) inset}
.cell.pop{transform:scale(0);opacity:0}
.gstat{display:flex;gap:10px;margin-bottom:10px}
.gstat div{flex:1;background:var(--card);border-radius:14px;padding:10px;text-align:center}
.gstat b{display:block;font-size:calc(29px*var(--fz,1))}
.prog{height:10px;border-radius:5px;background:var(--card);overflow:hidden;margin:8px 0 4px;position:relative}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
/* coupons */
.coupon{display:flex;background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:10px}
.coupon .pc{background:var(--acc);color:#fff;font-weight:900;font-size:calc(26px*var(--fz,1));min-width:80px;padding:0 8px;flex:0 0 auto;display:grid;place-items:center;border-right:3px dashed var(--bg);white-space:nowrap}
.coupon .ci{padding:12px;flex:1;min-width:0}
.coupon .ci .row{flex-wrap:wrap;gap:8px}
.coupon .ci .code{min-width:0;overflow-wrap:anywhere}
.coupon .ci button{white-space:normal;text-align:left;max-width:100%}
.coupon.used{opacity:.45}
.code{font-family:ui-monospace,monospace;font-weight:800;background:var(--soft);padding:4px 8px;border-radius:8px}
/* wheel */
.wstage{position:relative;margin:6px -6px 4px;padding:18px 0;border-radius:22px;background:repeating-linear-gradient(90deg,#fff 0 22px,#ffe3e3 22px 44px);overflow:hidden}
.wcf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.wheelw{position:relative;width:280px;height:280px;margin:0 auto;animation:wgp 1.8s ease-in-out infinite}

.wheel{width:100%;height:100%;display:block;transition:transform 5s cubic-bezier(.12,.8,.08,1);filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.wbulbs circle{animation:wbl 1s steps(1) infinite}.wbulbs circle:nth-child(odd){animation-delay:.5s}.wheelw.spin .wbulbs circle{animation-duration:.25s}
@keyframes wbl{50%{fill:#fff6c2}}
.wsg.wwin{animation:wwin .5s ease-in-out 6 alternate}@keyframes wwin{to{opacity:.5}}

.wptr.tick{animation:wtick .12s ease-out}@keyframes wtick{40%{transform:translateX(-50%) rotate(-18deg)}}
.whub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:#ffca28;color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.3),inset 0 2px 4px rgba(255,255,255,.6);text-shadow:0 1px 2px rgba(0,0,0,.25);z-index:2}

const AIZ_PROMPT=`You place "zoom zones" on a Russian social-media poster for a phone app. When the user taps, the app zooms into one zone so it fills the screen. Return ONLY JSON: {"zones":[{"box":[ymin,xmin,ymax,xmax],"label":"short Russian label"}]}
Coordinates are integers 0-1000 normalized to image height (y) and width x. IMPORTANT: every zone must have EXACTLY the same proportions as the whole image, i.e. (ymax-ymin) == (xmax-xmin) in these normalized units.
Rules (strict):
1. Few zones: 1 to 5 for the whole image, only as many as needed to read all meaningful text comfortably on a phone.
2. A zone contains complete meaningful text: headline and/or main text paragraphs, list items. Never cut a word, a line or a sentence. Never cut any other text either: if a zone edge would cross another text, move the zone up/down/sideways or resize it so that other text is either completely outside or (only if unavoidable) completely inside.
3. No duplication: text shown in one zone must not appear in another zone, unless geometrically impossible otherwise. Zones should not overlap or barely overlap.
4. Text should fill the zone edge to edge with small margins; maximize zoom.
5. Ignore purely decorative text (handwritten taglines, labels on objects, vk.com links, logos) - do not make zones for them, and do not cut them in half: either fully include or fully exclude.
6. Do not cut a character's face or a logo in half if avoidable; shift the zone.
7. If a headline alone is too wide to zoom, combine it with the text below it.
8. A zone must ALWAYS actually zoom in: never return a zone covering the whole image. Crop tightly to the outer edges of the text it contains (zone side at most ~85% of the image).
9. Minimal empty space: the text block should touch the zone edges with only a thin margin (about 1-2% of image). Do not leave empty bands above or below the text; shift the zone so the text is centered.
10. Headlines and subtitles ALWAYS get a zone (their own, or combined with adjacent main text). Never skip a headline.
11. Order zones in reading order.`;

async function doSaveCfg(){const c=JSON.parse(JSON.stringify(Store.config));
 document.querySelectorAll('[data-cf]').forEach(i=>{const p=i.dataset.cf.split('.');let o=c;for(let k=0;k<p.length-1;k++){o[p[k]]=o[p[k]]||{};o=o[p[k]]}o[p[p.length-1]]=i.value.trim()});
 c.coupons=readRows('ed-coupons').filter(a=>+a.min>0&&+a.percent>0&&a.code).map(a=>({min:+a.min,percent:+a.percent,code:a.code})).sort((a,b)=>a.min-b.min);
 const wp=readRows('ed-wheel').filter(a=>a.t&&+a.v>0).map(a=>({t:a.t,type:a.type,v:+a.v,w:+a.w||1}));if(wp.length>=2)c.wheelPrizes=wp;
 c.wheelCodes=readRows('ed-wcodes').filter(a=>+a.percent>0&&a.code).map(a=>({percent:+a.percent,code:a.code}));
 c.streakDays=+$('#cf-sdays').value||7;c.streakPercent=+$('#cf-sp').value||10;c.streakCode=$('#cf-sc').value.trim();
 c.holidays=$('#cf-hol').value.split('\n').map(l=>l.split(';').map(x=>x.trim())).filter(a=>/^\d{4}-\d\d-\d\d$/.test(a[0])).map(a=>({date:a[0],title:a[1]||'Праздник',tag:a[2]||''}));
 c.gamesPerDay=+$('#cf-gpd').value||3;c.couponDays=+$('#cf-days').value||7;c.referralPercent=+$('#cf-refp').value||10;c.referralCode=$('#cf-refc').value.trim();
 try{await saveConfig(c);toast('Сохранено на Диск')}catch(e){toast(e&&e.code==='notoken'?'Сначала подключите Диск в разделе «Админ»':'Не удалось сохранить')}render()}

<script>(()=>{const MAX=2,done=new Set(),vis=new Set();let act=0;
const start=(v,q)=>{const u=v.dataset.asrc;v.dataset.st=1;let fin=false;const end=()=>{if(fin)return;fin=true;if(q){act--;pump()}};
 v.addEventListener('canplay',()=>{done.add(u);v.classList.add('ok');if(vis.has(v))v.play().catch(()=>{});end()},{once:true});v.addEventListener('error',end,{once:true});setTimeout(end,15000);
 v.preload='auto';v.src=u;v.load()};
const dist=v=>{const r=v.getBoundingClientRect(),vh=innerHeight;if(!r.width&&!r.height)return 1e9;return (r.bottom<0?-r.bottom:r.top>vh?r.top-vh:0)+(r.left<0||r.left>innerWidth?vh/3:0)};
const pump=()=>{while(act<MAX){const lim=innerHeight*1.5;const c=[...document.querySelectorAll('video.anim[data-asrc]')].filter(v=>!v.dataset.st&&dist(v)<lim);if(!c.length)return;c.sort((a,b)=>dist(a)-dist(b));act++;start(c[0],true)}};
let pq=0;addEventListener('scroll',()=>{if(pq)return;pq=setTimeout(()=>{pq=0;pump()},200)},{passive:true});
const io=new IntersectionObserver(es=>{es.forEach(e=>{const v=e.target;if(e.isIntersecting){vis.add(v);if(v.dataset.st&&v.classList.contains('ok'))v.play().catch(()=>{});else if(!v.dataset.st&&done.has(v.dataset.asrc))start(v,false)}else{vis.delete(v);if(v.classList.contains('ok'))v.pause()}});pump()},{rootMargin:'250px 250px'});
const scan=()=>{document.querySelectorAll('video.anim[data-asrc]:not([data-io])').forEach(v=>{v.dataset.io=1;io.observe(v)});pump()};
new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});scan()})()</script>
