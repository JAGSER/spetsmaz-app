function itemText(sec,it,i){
 let t=`${i+1}. ${it.title}\nПерсонаж: ${it.char}\n`;
 if(sec.carousel){t+=`Картинок: ${it.count}\nДополнительные картинки:\n`+(it.slides||[]).map((s,k)=>`${k+1}) ${s}`).join('\n')+'\n'}
 else t+=`Описание: ${it.desc}\n`;
 return t}
function allText(){return data.s.map(sec=>sec.name+'\n\n'+sec.items.map((it,i)=>itemText(sec,it,i)).join('\n')).join('\n\n')}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Скопировано')}

document.addEventListener('input',e=>{
 const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
 const c=e.target.closest('.card');const it=data.s[c.dataset.si].items[c.dataset.ii];
 if(f==='slides')it.slides=[...e.target.querySelectorAll('li')].map(l=>l.textContent.trim()).filter(Boolean);
 else it[f]=e.target.textContent.trim();
 save()});
document.getElementById('copyAll').onclick=()=>copy(allText());
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 if(b.dataset.a==='newsec'){const v=document.getElementById('nsname').value.trim();if(!v){toast('Впишите название раздела');return}const car=/карусел/i.test(v);data.s.push({name:v,items:[],carousel:car});save();render();toast('Раздел добавлен');return}
 const row=b.closest('.addrow,.addwish');
 if(row){const si=+row.dataset.si;const sec=data.s[si];
  if(b.dataset.a==='addai'){const w=row.nextElementSibling;w.classList.toggle('on');if(w.classList.contains('on'))w.querySelector('input').focus()}
  if(b.dataset.a==='addman'){sec.items.push({title:'Новая тема',char:CHARS[0],desc:'',count:'',slides:[],added:true});save();render();const cs=document.querySelectorAll(`.card[data-si="${si}"] [data-f="title"]`);const el=cs[cs.length-1];if(el){el.focus();document.getSelection().selectAllChildren(el)}}
  if(b.dataset.a==='addgo')addTopic(si,row.querySelector('input').value.trim(),row.previousElementSibling.querySelector('.st'));
  return}
 const c=b.closest('.card');const sec=data.s[c.dataset.si];const ii=+c.dataset.ii;const it=sec.items[ii];
 if(b.dataset.a==='copy')copy(itemText(sec,it,ii));
 if(b.dataset.a==='art'){location.href='/articles/?b=sh#topic='+encodeURIComponent(STORE.replace('topics_','')+'|'+c.dataset.si+'|'+ii);return}
 if(b.dataset.a==='del'){if(confirm('Удалить эту добавленную тему?')){sec.items.splice(ii,1);save();render()}return}
 if(b.dataset.a==='regen'){const w=c.querySelector('.wish');w.classList.toggle('on');if(w.classList.contains('on'))w.querySelector('input').focus()}
 if(b.dataset.a==='go')regen(c,sec,ii,c.querySelector('.wish input').value.trim());
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.addwish input')){e.preventDefault();e.target.nextElementSibling.click();return}if(e.key==='Enter'&&e.target.matches('#nsname')){e.preventDefault();e.target.nextElementSibling.click();return}if(e.key==='Enter'&&e.target.matches('.wish input')){e.preventDefault();e.target.nextElementSibling.click()}});

// запросы к Claude идут через сервер «Помощника» (ключ только там), без регистрации
let HF=null,HREADY=null,HID=0;const HW={};
function helper(){if(HREADY)return HREADY;HREADY=new Promise(res=>{HF=document.createElement('iframe');HF.style.display='none';HF.src='https://pomoshnik.ai/topics-helper.html';
 addEventListener('message',e=>{if(e.origin!=='https://pomoshnik.ai')return;const d=e.data||{};if(d.type==='topics-ready')res();if(d.type==='topics-res'&&HW[d.id]){HW[d.id](d);delete HW[d.id]}});
 document.body.appendChild(HF)});return HREADY}
async function ask1(prompt){await helper();const id=++HID;return new Promise((res,rej)=>{const t=setTimeout(()=>{delete HW[id];rej(new Error('нет ответа'))},300000);
 HW[id]=d=>{clearTimeout(t);res(d)};HF.contentWindow.postMessage({type:'topics',id,prompt,system:'Отвечай по-русски. Только JSON без пояснений и без markdown. Не используй длинное тире.'},'https://pomoshnik.ai')})}
async function callApi(prompt,st){
 for(let a=1;a<=40;a++){
  let d;try{d=await ask1(prompt)}catch(e){d={error:e.message,status:529}}
  if(d.text){const t=d.text,s=t.indexOf('{'),e=t.lastIndexOf('}');try{return JSON.parse(t.slice(s,e+1))}catch(_){throw new Error('ответ не разобран, нажмите ещё раз')}}
  if(d.status&&![429,500,502,503,529].includes(d.status)&&d.error!=='busy')throw new Error(d.error||'ошибка');
  st.textContent='API занят, жду… попытка '+a;await new Promise(r=>setTimeout(r,15000));
 }
 throw new Error('API долго занят, попробуйте позже')}

async function regen(c,sec,ii,wish){
 const st=c.querySelector('.st');c.classList.add('busy');st.textContent='Генерирую…';
 const others=data.s.flatMap(s=>s.items.map(x=>x.title)).filter((t,i)=>t!==sec.items[ii].title);
 const shape=sec.carousel?'{"title":"короткое название карусели","char":"персонаж","count":"N, одна общая обложка и M дополнительных","slides":["тема доп. картинки 1","..."]} (M от 5 до 7, slides ровно M штук)'
  :'{"title":"заголовок поста","char":"персонаж","desc":"описание одной фразой"}';
 const prompt=`${BRAND}
Раздел: ${sec.name}. Придумай ОДНУ новую тему ${sec.carousel?'карусели':'поста'} вместо этой: "${sec.items[ii].title}".
${wish?'Пожелание: '+wish+'\n':''}Персонаж строго один из: ${CHARS.join(', ')}. Выбирай по логике персонажей.
Стиль заголовков как у прошлых тем. Нельзя повторять или перефразировать темы ниже.
Другие новые темы на странице: ${others.join('; ')}
Уже вышедшие темы: ${PAST.join('; ')}
Ответ строго JSON: ${shape}`;
 try{
  const r=await callApi(prompt,st);
  const it=sec.items[ii];it.title=r.title||it.title;it.char=r.char||it.char;
  if(sec.carousel){it.count=r.count||it.count;if(Array.isArray(r.slides))it.slides=r.slides}else it.desc=r.desc||it.desc;
  save();render();toast('Тема обновлена');
 }catch(e){c.classList.remove('busy');st.textContent=e.message}
}
async function addTopic(si,wish,st){
 const sec=data.s[si];st.textContent='Придумываю тему…';
 const others=data.s.flatMap(s=>s.items.map(x=>x.title));
 const shape=sec.carousel?'{"title":"короткое название карусели","char":"персонаж","count":"N, одна общая обложка и M дополнительных","slides":["тема доп. картинки 1","..."]} (M от 5 до 7, slides ровно M штук)'
  :'{"title":"заголовок поста","char":"персонаж","desc":"описание одной фразой"}';
 const prompt=`${BRAND}
Раздел: ${sec.name}. Придумай ОДНУ новую тему ${sec.carousel?'карусели':'поста'} для этого раздела, продолжая список.
${wish?'Пожелание: '+wish+'\n':''}Персонаж строго один из: ${CHARS.join(', ')}. Выбирай по логике персонажей.
Стиль заголовков как у прошлых тем. Нельзя повторять или перефразировать темы ниже.
Темы на странице: ${others.join('; ')}
Уже вышедшие темы: ${PAST.join('; ')}
Ответ строго JSON: ${shape}`;
 try{const r=await callApi(prompt,st);sec.items.push({title:r.title||'Новая тема',char:r.char||CHARS[0],desc:r.desc||'',count:r.count||'',slides:Array.isArray(r.slides)?r.slides:[],added:true});save();render();toast('Тема добавлена')}
 catch(e){st.textContent=e.message}}
render();
addEventListener('load',()=>{if(window.Kit)Kit.syncTopics(STORE,data).then(d=>{if(d&&d!==data){data=d;render()}const e=syncEl();if(e&&!Kit.token())e.textContent=syncTxt.local})});
addEventListener('pageshow',e=>{if(e.persisted)render()});
</script>
